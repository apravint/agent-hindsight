[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hindsight"
version = "0.1.0"
description = "Temporal long-term memory engine with recency decay and FTS5 ranking for AI coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ayyappa Pravin", email = "apravint@gmail.com" }
]
keywords = ["llm", "ai-agents", "memory", "long-term-memory", "sqlite", "fts5", "claude-code", "cursor", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = []

[project.scripts]
hindsight = "agent_hindsight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hindsight"]
